x-service: &service
  build: .
  restart: unless-stopped
  environment: &service-env
    STOCKROOM_DATABASE_URL: postgresql://stockroom:stockroom@postgres:5432/stockroom
    STOCKROOM_RABBITMQ_URL: amqp://stockroom:stockroom@rabbitmq:5672/
  depends_on: &service-deps
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockroom
      POSTGRES_PASSWORD: stockroom
      POSTGRES_DB: stockroom
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockroom -d stockroom"]
      interval: 2s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: stockroom
      RABBITMQ_DEFAULT_PASS: stockroom
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 20

  inventory:
    <<: *service
    command: ["uvicorn", "--factory", "stockroom.inventory.api:create_app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8101:8000"

  orders:
    <<: *service
    command: ["uvicorn", "--factory", "stockroom.orders.api:create_app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8102:8000"

  inventory-seed:
    build: .
    command: ["python", "-m", "stockroom.inventory.seed"]
    environment: *service-env
    depends_on:
      inventory:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  rabbitmq:
