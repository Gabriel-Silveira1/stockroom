services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stockroom
      POSTGRES_PASSWORD: stockroom
      POSTGRES_DB: stockroom
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockroom -d stockroom"]
      interval: 2s
      timeout: 3s
      retries: 20

  inventory:
    build: .
    command: ["uvicorn", "--factory", "stockroom.inventory.api:create_app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      STOCKROOM_DATABASE_URL: postgresql://stockroom:stockroom@postgres:5432/stockroom
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  inventory-seed:
    build: .
    command: ["python", "-m", "stockroom.inventory.seed"]
    environment:
      STOCKROOM_DATABASE_URL: postgresql://stockroom:stockroom@postgres:5432/stockroom
    depends_on:
      inventory:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
