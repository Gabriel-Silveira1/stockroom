[project]
name = "stockroom"
version = "0.1.0"
description = "Event-driven inventory and fulfillment services for a fictional online game store."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.4",
    "aio-pika>=9.4",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pre-commit-hooks>=6.0.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockroom"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "C4", "RET", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.pylint]
max-args = 7

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: needs a real Postgres (STOCKROOM_TEST_DATABASE_URL)"]
addopts = "--strict-markers"
